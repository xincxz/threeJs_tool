<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js R146 GLB动画控制器 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* 控制面板 */
    .control-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      z-index: 100;
      min-width: 340px;
    }

    .control-panel h4 {
      margin-bottom: 10px;
      color: #4cd964;
    }

    .row {
      margin: 6px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    input,
    button,
    select {
      padding: 5px 8px;
      font-size: 13px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #2185d0;
      color: white;
    }

    button.danger {
      background: #db2828;
    }

    button.success {
      background: #21ba45;
    }

    .log-box {
      margin-top: 10px;
      background: #111;
      padding: 8px;
      height: 140px;
      overflow-y: auto;
      font-size: 12px;
      color: #9cf;
    }
  </style>
</head>

<body>
  <div id="canvas-container"></div>
  <div class="control-panel">
    <h4>GLB动画控制器 R146 Demo</h4>
    <div class="row">
      <label>模型地址:</label>
      <input type="text" id="modelUrl" placeholder="./model/car-middle.glb" style="width:220px" value="./model/car-middle.glb">
      <button id="loadBtn" class="success">加载模型</button>
    </div>
    <div class="row">
      <label>可用动画:</label>
      <select id="animSelect">
        <option value="">--请先加载模型--</option>
      </select>
    </div>
    <div class="row">
      <button id="playFull">播放完整动画</button>
      <button id="playReverse">完整动画倒放</button>
    </div>
    <div class="row">
      <label>片段:</label>
      <input type="number" id="startTime" value="1" step="0.1" style="width:60px"> ~
      <input type="number" id="endTime" value="3" step="0.1" style="width:60px">
      <button id="playSegment">播放片段</button>
      <button id="playSegmentReverse">片段倒放</button>
    </div>
    <div class="row">
      <button id="pauseBtn">暂停</button>
      <button id="resumeBtn">继续</button>
      <button id="stopBtn" class="danger">停止</button>
    </div>
    <div class="row">
      <label>跳转时间:</label>
      <input type="number" id="gotoTimeInput" value="2" step="0.1" style="width:60px">
      <button id="gotoTimeBtn">跳转定格</button>

      <label>跳转帧:</label>
      <input type="number" id="gotoFrameInput" value="60" style="width:60px">
      <button id="gotoFrameBtn">跳转定格</button>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>

  <!-- Three.js R146 CDN 固定版本！！不要改 -->
  <!--<script type="module" src="./three/r146/build/three.module.js"></script>-->
  <!--<script type="module" src="./three/r146/examples/js/loaders/GLTFLoader.js"></script>-->
  <!--<script type="module" src="./three/r146/examples/js/controls/OrbitControls.js"></script>-->
  <script type="module">
    import * as THREE from './three/r146/build/three.module.js';
    import {GLTFLoader} from './three/r146/examples/jsm/loaders/GLTFLoader.js';
    import {OrbitControls} from './three/r146/examples/jsm/controls/OrbitControls.js';

    // =========把 GlbAnimationController 类、demo全部业务代码粘贴到这里=========
    // 注意：类代码里面 new GLTFLoader() 直接使用导入的GLTFLoader，不需要全局
  </script>

  <script defer>
    // ======================【粘贴增强版 GlbAnimationController JS 类 到这里】======================
    /**
     * Three.js R146 GLB多动画控制器【增强版】
     */
    class GlbAnimationController {
      constructor(scene) {
        this.scene = scene;
        this.loader = new GLTFLoader();

        this.gltf = null;
        this.model = null;
        this.animator = null;
        this.clipsMap = new Map();
        this.activeActions = new Map();

        this.globalTimeScale = 1.0;
        this.isPaused = false;

        this._eventCallbacks = {
          onAnimationEnd: null,
          onSegmentEnd: null
        };
        this._onMixerFinished = this._handleMixerFinished.bind(this);
      }

      loadModel(url, includeAnimNames = []) {
        return new Promise((resolve, reject) => {
          this.loader.load(
            url,
            (gltf) => {
              this.gltf = gltf;
              this.model = gltf.scene;
              this.scene.add(this.model);

              this.animator = new THREE.AnimationMixer(this.model);
              this.animator.addEventListener('finished', this._onMixerFinished);

              this.clipsMap.clear();
              this.activeActions.clear();

              const allClips = gltf.animations || [];
              let useClips = [];
              if (includeAnimNames.length > 0) {
                useClips = allClips.filter((clip) => includeAnimNames.includes(clip.name));
              } else {
                useClips = [...allClips];
              }

              useClips.forEach((clip) => {
                this.clipsMap.set(clip.name, clip);
              });

              resolve({
                model: this.model,
                clips: useClips
              });
            },
            () => { },
            (err) => reject(err)
          );
        });
      }

      on(eventName, callback) {
        if (this._eventCallbacks.hasOwnProperty(eventName)) {
          this._eventCallbacks[eventName] = callback;
        }
      }

      _handleMixerFinished(e) {
        const action = e.action;
        if (!action || !action._clip) return;
        const clipName = action._clip.name;

        if (clipName.includes('_seg_')) {
          if (typeof this._eventCallbacks.onSegmentEnd === 'function') {
            this._eventCallbacks.onSegmentEnd(clipName.replace(/_seg_.*/, ''));
          }
        } else {
          if (typeof this._eventCallbacks.onAnimationEnd === 'function') {
            this._eventCallbacks.onAnimationEnd(clipName);
          }
        }
      }

      getClipNames() {
        return Array.from(this.clipsMap.keys());
      }

      getClipDuration(animName) {
        const clip = this.clipsMap.get(animName);
        if (!clip) return 0;
        return clip.duration;
      }

      getClipTotalFrames(animName, fps = 30) {
        const dur = this.getClipDuration(animName);
        return Math.floor(dur * fps);
      }

      getCurrentTime(animName) {
        const act = this.activeActions.get(animName);
        if (!act) return 0;
        return act.time;
      }

      getCurrentFrame(animName, fps = 30) {
        return Math.floor(this.getCurrentTime(animName) * fps);
      }

      getAnimState(animName) {
        const act = this.activeActions.get(animName);
        if (!act) {
          return { playing: false, paused: false, currentTime: 0, currentFrame: 0, duration: 0 };
        }
        const dur = this.getClipDuration(animName);
        const curTime = act.time;
        return {
          playing: act.isRunning(),
          paused: act.paused,
          currentTime: curTime,
          currentFrame: Math.floor(curTime * 30),
          duration: dur
        };
      }

      playFull(animName, loop = false, timeScale = 1.0) {
        if (!this.animator) return;
        const clip = this.clipsMap.get(animName);
        if (!clip) {
          console.warn(`不存在动画:${animName}`);
          return;
        }
        this._stopAction(animName);
        const action = this.animator.clipAction(clip);
        action.reset();
        action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
        action.clampWhenFinished = true;
        action.timeScale = timeScale;
        action.play();
        this.activeActions.set(animName, action);
        this.isPaused = false;
      }

      playSegment(animName, startSec, endSec, loop = false, timeScale = 1.0) {
        if (!this.animator) return;
        const srcClip = this.clipsMap.get(animName);
        if (!srcClip) {
          console.warn(`不存在动画:${animName}`);
          return;
        }
        const dur = srcClip.duration;
        startSec = Math.max(0, startSec);
        endSec = Math.min(dur, endSec);
        if (startSec >= endSec) return;

        this._stopAction(animName);
        const segClip = srcClip.clone();
        segClip.name = `${animName}_seg_${Date.now()}`;
        segClip.trim(startSec, endSec);

        const action = this.animator.clipAction(segClip);
        action.reset();
        action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
        action.clampWhenFinished = true;
        action.timeScale = timeScale;
        action.play();
        this.activeActions.set(animName, action);
        this.isPaused = false;
      }

      gotoTime(animName, timeSec) {
        if (!this.animator) return;
        const clip = this.clipsMap.get(animName);
        if (!clip) return;
        const dur = clip.duration;
        timeSec = THREE.MathUtils.clamp(timeSec, 0, dur);

        this._stopAction(animName);
        const action = this.animator.clipAction(clip);
        action.reset();
        action.time = timeSec;
        action.play();
        action.paused = true;
        this.activeActions.set(animName, action);
        this.animator.update(0);
      }

      gotoFrame(animName, frameIndex, fps = 30) {
        const timeSec = frameIndex / fps;
        this.gotoTime(animName, timeSec);
      }

      pauseAll() {
        if (!this.animator) return;
        this.isPaused = true;
        this.activeActions.forEach((act) => {
          act.paused = true;
        });
      }

      resumeAll() {
        if (!this.animator) return;
        this.isPaused = false;
        this.activeActions.forEach((act) => {
          act.paused = false;
        });
      }

      setTimeScale(animName, scale) {
        const act = this.activeActions.get(animName);
        if (act) {
          act.timeScale = scale;
        }
      }

      _stopAction(animName) {
        const oldAct = this.activeActions.get(animName);
        if (oldAct) {
          oldAct.stop();
          oldAct.reset();
          if (oldAct._clip) oldAct._clip.dispose();
        }
        this.activeActions.delete(animName);
      }

      stopAll() {
        if (!this.animator) return;
        this.activeActions.forEach((act) => {
          act.stop();
          act.reset();
          if (act._clip) act._clip.dispose();
        });
        this.activeActions.clear();
      }

      update(delta) {
        if (!this.animator || this.isPaused) return;
        this.animator.update(delta);
      }

      dispose() {
        this.stopAll();
        if (this.animator) {
          this.animator.removeEventListener('finished', this._onMixerFinished);
        }
        if (this.model) {
          this.scene.remove(this.model);
          this.model.traverse((obj) => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (Array.isArray(obj.material)) {
                obj.material.forEach(m => m.dispose());
              } else {
                obj.material.dispose();
              }
            }
          });
        }
        this.model = null;
        this.gltf = null;
        this.animator = null;
        this.clipsMap.clear();
        this.activeActions.clear();
      }
    }
    // ====================== 类代码结束 ======================

    // ---------------------- Demo 业务逻辑 ----------------------
    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
    camera.position.set(4, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    const clock = new THREE.Clock();

    // 灯光
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(6, 10, 6);
    scene.add(dirLight);

    // 地面
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 控制器实例
    const animCtrl = new GlbAnimationController(scene);
    const logBox = document.getElementById('logBox');

    function log(text) {
      const div = document.createElement('div');
      div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 监听动画事件
    animCtrl.on('onAnimationEnd', (name) => {
      log(`✅ 完整动画播放结束：${name}`);
    });
    animCtrl.on('onSegmentEnd', (name) => {
      log(`✅ 片段动画播放结束：${name}`);
    });

    const animSelect = document.getElementById('animSelect');
    const modelUrlInput = document.getElementById('modelUrl');

    // 加载模型按钮
    document.getElementById('loadBtn').onclick = async () => {
      const url = modelUrlInput.value.trim();
      if (!url) return log('❌ 请输入模型地址');
      try {
        log(`正在加载模型: ${url}`);
        // [] 加载全部动画；你可以指定 ['anim1','anim2'] 只加载部分动画
        await animCtrl.loadModel(url, []);
        log('🎉 模型加载成功！');
        // 填充下拉框
        const names = animCtrl.getClipNames();
        animSelect.innerHTML = '';
        names.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          animSelect.appendChild(opt);
        });
        log(`可用动画列表：${names.join(',')}`);
      } catch (e) {
        log(`❌ 加载失败: ${e.message}`);
      }
    };

    // 按钮事件
    document.getElementById('playFull').onclick = () => {
      const anim = animSelect.value;
      animCtrl.playFull(anim, false, 1);
      log(`▶ 播放完整动画【${anim}】正向`);
    };
    document.getElementById('playReverse').onclick = () => {
      const anim = animSelect.value;
      animCtrl.playFull(anim, false, -1);
      log(`◀ 完整动画【${anim}】倒放`);
    };
    document.getElementById('playSegment').onclick = () => {
      const anim = animSelect.value;
      const s = Number(document.getElementById('startTime').value);
      const e = Number(document.getElementById('endTime').value);
      animCtrl.playSegment(anim, s, e, false, 1);
      log(`▶ 播放片段【${anim}】${s}s ~ ${e}s`);
    };
    document.getElementById('playSegmentReverse').onclick = () => {
      const anim = animSelect.value;
      const s = Number(document.getElementById('startTime').value);
      const e = Number(document.getElementById('endTime').value);
      animCtrl.playSegment(anim, s, e, false, -1);
      log(`◀ 片段倒放【${anim}】${s}s ~ ${e}s`);
    };
    document.getElementById('pauseBtn').onclick = () => {
      animCtrl.pauseAll();
      log('⏸ 全部暂停');
    };
    document.getElementById('resumeBtn').onclick = () => {
      animCtrl.resumeAll();
      log('▶ 继续播放');
    };
    document.getElementById('stopBtn').onclick = () => {
      animCtrl.stopAll();
      log('⏹ 停止全部动画');
    };
    document.getElementById('gotoTimeBtn').onclick = () => {
      const anim = animSelect.value;
      const t = Number(document.getElementById('gotoTimeInput').value);
      animCtrl.gotoTime(anim, t);
      log(`📍 定格动画【${anim}】到 ${t}秒`);
    };
    document.getElementById('gotoFrameBtn').onclick = () => {
      const anim = animSelect.value;
      const f = Number(document.getElementById('gotoFrameInput').value);
      animCtrl.gotoFrame(anim, f, 30);
      log(`📍 定格动画【${anim}】到 ${f}帧`);
    };

    // 渲染循环
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const delta = clock.getDelta();
      animCtrl.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    })
  </script>
</body>

</html>
